<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 보관함</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --sub: #6b7280;
    --line: #e3e6eb; --accent: #3a5bc7; --accent-weak: #e8edfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1e26; --text: #eceef3; --sub: #9aa1b0;
      --line: #2a2e39; --accent: #7b96f0; --accent-weak: #232a45;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--sub); margin-bottom: 18px; min-height: 1.4em; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .lead { color: var(--sub); font-size: 0.9rem; margin: 0 0 18px; }

  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .tile {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.12); border-color: var(--accent); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile .t { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .tile .s { font-size: 0.85rem; color: var(--sub); }

  .acc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .acc.open { border-color: var(--accent); }
  .acc-head {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .acc-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .num {
    flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent-weak); color: var(--accent); font-weight: 700;
  }
  .acc.open .num { background: var(--accent); color: #fff; }
  .acc-title { flex: 1; font-weight: 600; word-break: break-word; }
  .resume { font-size: 0.78rem; color: var(--accent); background: var(--accent-weak); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .chev { flex: none; color: var(--sub); transition: transform .2s; }
  .acc.open .chev { transform: rotate(180deg); }
  .acc-panel { border-top: 1px solid var(--line); padding: 14px 18px 18px; }
  .player { background: #000; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; }
  .player video, .player iframe { width: 100%; height: 100%; display: block; border: 0; background: #000; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .controls .label { color: var(--sub); font-size: 0.85rem; margin-right: 2px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--sub); font-size: 0.78rem; margin-top: 10px; }
  .empty { text-align: center; color: var(--sub); padding: 56px 16px; border: 1px dashed var(--line); border-radius: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
  <main id="view"></main>
</div>

<script src="videos.js"></script>
<script>
// 데이터: { month: "9월", category: "수업", no: 1, title: "...", file | youtube }
const VIDEOS = (window.VIDEOS || []).map((v, i) => ({ ...v, id: v.id || v.file || v.youtube || String(i) }));
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
const view = document.getElementById("view");
const crumb = document.getElementById("crumb");

function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }
function posKey(v) { return "vs-pos:" + v.id; }
function fmt(sec) {
  if (!isFinite(sec) || sec <= 0) return "";
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function href(...parts) { return "#/" + parts.map(encodeURIComponent).join("/"); }

// 월은 숫자 오름차순, 카테고리는 데이터에 나온 순서, 영상은 번호순
function months() {
  const set = [...new Set(VIDEOS.map(v => v.month).filter(Boolean))];
  return set.sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
}
function categories(month) {
  return [...new Set(VIDEOS.filter(v => v.month === month).map(v => v.category).filter(Boolean))];
}
function items(month, category) {
  return VIDEOS.filter(v => v.month === month && v.category === category)
    .map((v, i) => ({ v, no: v.no || i + 1 }))
    .sort((a, b) => a.no - b.no);
}

function setCrumb(list) {
  crumb.innerHTML = "";
  list.forEach((c, i) => {
    if (i) crumb.appendChild(el("span", "", "›"));
    if (c.href) { const a = el("a", "", c.label); a.href = c.href; crumb.appendChild(a); }
    else crumb.appendChild(el("span", "", c.label));
  });
}

function tile(to, title, sub) {
  const a = el("a", "tile"); a.href = to;
  a.append(el("div", "t", title), el("div", "s", sub));
  return a;
}

function showHome() {
  document.title = "영상 보관함";
  setCrumb([]);
  view.innerHTML = "";
  view.appendChild(el("h1", "", "영상 보관함"));
  const ms = months();
  if (!ms.length) {
    const e = el("div", "empty"); e.innerHTML = "아직 올린 영상이 없어요.<br><code>videos.js</code>에 영상을 추가하면 여기에 나타나요.";
    view.appendChild(e); return;
  }
  view.appendChild(el("p", "lead", "월을 선택하세요"));
  const grid = el("div", "tiles");
  ms.forEach(m => grid.appendChild(tile(href(m), m, `영상 ${VIDEOS.filter(v => v.month === m).length}개`)));
  view.appendChild(grid);
}

function showMonth(month) {
  if (!categories(month).length) return showHome();
  document.title = `${month} · 영상 보관함`;
  setCrumb([{ label: "영상 보관함", href: "#/" }, { label: month }]);
  view.innerHTML = "";
  view.appendChild(el("h1", "", month));
  view.appendChild(el("p", "lead", "보고 싶은 항목을 선택하세요"));
  const grid = el("div", "tiles");
  categories(month).forEach(c => grid.appendChild(tile(href(month, c), c, `영상 ${items(month, c).length}개`)));
  view.appendChild(grid);
}

function closeAll() {
  view.querySelectorAll(".acc.open").forEach(a => collapse(a));
}
function collapse(acc) {
  const panel = acc.querySelector(".acc-panel");
  const vid = panel.querySelector("video");
  if (vid) { vid.pause(); vid.removeAttribute("src"); vid.load(); }
  panel.innerHTML = ""; panel.hidden = true;
  acc.classList.remove("open");
  acc.querySelector(".acc-head").setAttribute("aria-expanded", "false");
}

function setSpeed(panel, rate) {
  const vid = panel.querySelector("video");
  if (vid) vid.playbackRate = rate;
  store("vs-speed", String(rate));
  panel.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", parseFloat(c.dataset.rate) === rate));
}

function expand(acc, v) {
  closeAll();
  const panel = acc.querySelector(".acc-panel");
  panel.innerHTML = ""; panel.hidden = false;
  acc.classList.add("open");
  acc.querySelector(".acc-head").setAttribute("aria-expanded", "true");

  const box = el("div", "player");
  panel.appendChild(box);
  if (v.youtube) {
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${v.youtube}?rel=0`;
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    box.appendChild(f);
  } else {
    const vid = document.createElement("video");
    vid.controls = true; vid.playsInline = true; vid.preload = "metadata"; vid.src = encodeURI(v.file);
    const saved = parseFloat(store(posKey(v)));
    const hint = el("div", "hint");
    vid.addEventListener("loadedmetadata", () => {
      if (saved > 5 && saved < vid.duration - 5) { vid.currentTime = saved; hint.textContent = `이전에 보던 ${fmt(saved)} 위치부터 이어서 재생해요. 키보드: 스페이스 재생/정지 · ←/→ 5초 이동`; }
      vid.playbackRate = parseFloat(store("vs-speed")) || 1;
    });
    let last = 0;
    vid.addEventListener("timeupdate", () => {
      if (Math.abs(vid.currentTime - last) >= 3) { last = vid.currentTime; store(posKey(v), String(vid.currentTime)); }
    });
    vid.addEventListener("ended", () => store(posKey(v), "0"));
    vid.addEventListener("error", () => { hint.textContent = "영상을 불러오지 못했어요. 파일 경로와 형식(mp4 권장)을 확인해 주세요."; });
    box.appendChild(vid);

    const controls = el("div", "controls");
    controls.appendChild(el("span", "label", "속도"));
    SPEEDS.forEach(r => {
      const c = el("button", "chip", r + "x"); c.type = "button"; c.dataset.rate = r;
      c.addEventListener("click", () => setSpeed(panel, r));
      controls.appendChild(c);
    });
    panel.append(controls, hint);
    if (!saved || saved <= 5) hint.textContent = "키보드: 스페이스 재생/정지 · ←/→ 5초 이동";
    setSpeed(panel, parseFloat(store("vs-speed")) || 1);
    vid.play().catch(() => {});
  }
  acc.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showCategory(month, category) {
  const list = items(month, category);
  if (!list.length) return showMonth(month);
  document.title = `${month} ${category} · 영상 보관함`;
  setCrumb([{ label: "영상 보관함", href: "#/" }, { label: month, href: href(month) }, { label: category }]);
  view.innerHTML = "";
  view.appendChild(el("h1", "", `${month} ${category}`));
  view.appendChild(el("p", "lead", "번호를 누르면 아래로 영상이 펼쳐져요"));
  list.forEach(({ v, no }) => {
    const acc = el("div", "acc");
    const head = el("button", "acc-head"); head.type = "button"; head.setAttribute("aria-expanded", "false");
    head.append(el("span", "num", String(no)), el("span", "acc-title", v.title || `${no}`));
    const saved = parseFloat(store(posKey(v)));
    if (saved > 5) head.appendChild(el("span", "resume", `이어보기 ${fmt(saved)}`));
    head.appendChild(el("span", "chev", "▾"));
    const panel = el("div", "acc-panel"); panel.hidden = true;
    head.addEventListener("click", () => { acc.classList.contains("open") ? collapse(acc) : expand(acc, v); });
    acc.append(head, panel);
    view.appendChild(acc);
  });
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  window.scrollTo(0, 0);
  if (parts.length >= 2) showCategory(parts[0], parts[1]);
  else if (parts.length === 1) showMonth(parts[0]);
  else showHome();
}

document.addEventListener("keydown", e => {
  if (e.target.closest("button, a, input, select")) return;
  const vid = view.querySelector(".acc.open video");
  if (!vid) return;
  if (e.key === " ") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); vid.currentTime = Math.min(vid.duration || 1e9, vid.currentTime + 5); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); vid.currentTime = Math.max(0, vid.currentTime - 5); }
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
